services:
  - type: web
    name: evidence-research
    runtime: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: evidence-research
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: MAX_REQUESTS_PER_MINUTE
        value: "30"
