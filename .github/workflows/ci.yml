name: CI and security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools and app dependencies
        run: python -m pip install -r requirements-dev.txt ruff bandit pip-audit
      - name: Run unit checks
        run: python -m pytest -q
      - name: Lint
        run: ruff check app tests
      - name: Scan Python code
        run: bandit -q -r app
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build container
        run: docker build --tag evidence-research:ci .
